# Chạy:  cd deploy && cp .env.example .env && (sửa .env) && docker compose up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: crm-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - crm_data:/data          # CSDL + sao lưu tự động nằm ở đây (bền vững qua các lần cập nhật)
    expose:
      - "8000"                  # chỉ mạng nội bộ Docker, KHÔNG mở ra internet

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    container_name: crm-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data        # giữ chứng chỉ HTTPS
      - caddy_config:/config

volumes:
  crm_data:
  caddy_data:
  caddy_config:
